[package]
name = "sisko"
version = "0.1.0"
edition = "2024"
description = "A desktop Nushell workbench"
license = "MIT"
repository = "https://github.com/fdncred/sisko"
readme = "README.md"

[dependencies]
anyhow = "1"
gpui = { git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["font-kit"] }
gpui-component = { git = "https://github.com/longbridge/gpui-component" }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component" }
lscolors = { version = "0.21", default-features = false, features = ["nu-ansi-term"] }
nu-ansi-term = "0.50"
nu-cli = { version = "0.115", features = ["sqlite"] }
nu-cmd-extra = "0.115"
nu-cmd-lang = "0.115"
nu-color-config = "0.115"
nu-command = { version = "0.115", features = ["sqlite"] }
nu-config = "0.115"
nu-std = "0.115"
nu-engine = "0.115"
nu-parser = "0.115"
nu-protocol = { version = "0.115", features = ["sqlite"] }
nu-utils = "0.115"

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
